experiment:
  name: masked_patch_pretraining
  seed: 42

data:
  input_length: 512
  channels: multivariate
  sampling_rate_policy: preserve_native

masking:
  strategy: patch_span
  patch_len: 16
  mask_ratio: 0.4

encoder:
  type: temporal_transformer
  d_model: 256
  n_layers: 6
  n_heads: 8

objective:
  reconstruction: mse
  regularization: channel_dropout

